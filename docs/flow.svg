<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1180" width="1240" height="1180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88d498"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7fb0bd"/>
    </marker>
  </defs>

  <rect width="1240" height="1180" fill="#0b2730"/>

  <text x="40" y="46" fill="#f3e9d2" font-size="25" font-weight="700">Agentic Inventory System — Request Flow</text>
  <text x="40" y="72" fill="#88d498" font-size="13.5">Solid arrows are calls, dashed arrows are responses. Both phases were exercised end to end against PostgreSQL in the recorded run.</text>

  <!-- lifelines -->
  <g>
    <rect x="60" y="96" width="176" height="42" rx="9" fill="#1a936f"/>
    <text x="148" y="123" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Browser</text>
    <line x1="148" y1="138" x2="148" y2="1140" stroke="#2f7f93" stroke-width="1.3" stroke-dasharray="4 5"/>

    <rect x="290" y="96" width="176" height="42" rx="9" fill="#15505f" stroke="#88d498"/>
    <text x="378" y="123" fill="#f3e9d2" font-size="13" font-weight="700" text-anchor="middle">FastAPI</text>
    <line x1="378" y1="138" x2="378" y2="1140" stroke="#2f7f93" stroke-width="1.3" stroke-dasharray="4 5"/>

    <rect x="520" y="96" width="176" height="42" rx="9" fill="#15505f" stroke="#88d498"/>
    <text x="608" y="123" fill="#f3e9d2" font-size="13" font-weight="700" text-anchor="middle">Agent</text>
    <line x1="608" y1="138" x2="608" y2="1140" stroke="#2f7f93" stroke-width="1.3" stroke-dasharray="4 5"/>

    <rect x="750" y="96" width="176" height="42" rx="9" fill="#15505f" stroke="#88d498"/>
    <text x="838" y="123" fill="#f3e9d2" font-size="13" font-weight="700" text-anchor="middle">Services</text>
    <line x1="838" y1="138" x2="838" y2="1140" stroke="#2f7f93" stroke-width="1.3" stroke-dasharray="4 5"/>

    <rect x="980" y="96" width="196" height="42" rx="9" fill="#114b5f" stroke="#88d498"/>
    <text x="1078" y="123" fill="#f3e9d2" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL / LLM</text>
    <line x1="1078" y1="138" x2="1078" y2="1140" stroke="#2f7f93" stroke-width="1.3" stroke-dasharray="4 5"/>
  </g>

  <!-- ========== PHASE A ========== -->
  <rect x="40" y="158" width="1160" height="34" rx="8" fill="#13404d"/>
  <text x="60" y="181" fill="#88d498" font-size="13" font-weight="700" letter-spacing="1.2">PHASE A — ONBOARDING: bridge the legacy schema (runs once per tenant)</text>

  <g font-size="11.5">
    <text x="60" y="222" fill="#f3e9d2" font-size="12" font-weight="700">1</text>
    <line x1="148" y1="228" x2="372" y2="228" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="156" y="222" fill="#cfe9d8">POST /onboarding/inspect { connection_string }</text>

    <text x="60" y="262" fill="#f3e9d2" font-size="12" font-weight="700">2</text>
    <line x1="378" y1="268" x2="1072" y2="268" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="386" y="262" fill="#cfe9d8">rewrite the async URL to a sync driver, then reflect the live schema</text>

    <text x="60" y="302" fill="#f3e9d2" font-size="12" font-weight="700">3</text>
    <line x1="1072" y1="308" x2="154" y2="308" stroke="#7fb0bd" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#b)"/>
    <text x="386" y="302" fill="#aecfd6">TBL_STOCK_MST, TBL_ORD_HDR and their columns</text>

    <text x="60" y="342" fill="#f3e9d2" font-size="12" font-weight="700">4</text>
    <line x1="148" y1="348" x2="372" y2="348" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="156" y="342" fill="#cfe9d8">POST /suggest-mapping { legacy_schema }</text>

    <text x="60" y="382" fill="#f3e9d2" font-size="12" font-weight="700">5</text>
    <line x1="378" y1="388" x2="1072" y2="388" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="386" y="382" fill="#cfe9d8">LLM is asked to match the legacy columns onto the standard model</text>

    <text x="60" y="422" fill="#f3e9d2" font-size="12" font-weight="700">6</text>
    <line x1="1072" y1="428" x2="154" y2="428" stroke="#7fb0bd" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#b)"/>
    <text x="386" y="422" fill="#aecfd6">MappingManifest — sku→C_ITEM_CD, quantity→N_QTY_ON_HAND, …</text>

    <text x="60" y="462" fill="#f3e9d2" font-size="12" font-weight="700">7</text>
    <rect x="156" y="446" width="196" height="26" rx="6" fill="#1a936f"/>
    <text x="254" y="464" fill="#ffffff" font-size="11.5" text-anchor="middle">user reviews the canvas</text>

    <text x="60" y="502" fill="#f3e9d2" font-size="12" font-weight="700">8</text>
    <line x1="148" y1="508" x2="372" y2="508" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="156" y="502" fill="#cfe9d8">POST /save-manifest (on approval)</text>

    <text x="60" y="542" fill="#f3e9d2" font-size="12" font-weight="700">9</text>
    <rect x="374" y="526" width="330" height="26" rx="6" fill="#15505f" stroke="#2f7f93"/>
    <text x="539" y="544" fill="#aecfd6" font-size="11.5" text-anchor="middle">manifest_&lt;tenant&gt;.json written; browser keeps the connection</text>
  </g>

  <!-- ========== PHASE B ========== -->
  <rect x="40" y="578" width="1160" height="34" rx="8" fill="#13404d"/>
  <text x="60" y="601" fill="#88d498" font-size="13" font-weight="700" letter-spacing="1.2">PHASE B — QUERY: every message in the agent terminal</text>

  <g font-size="11.5">
    <text x="56" y="642" fill="#f3e9d2" font-size="12" font-weight="700">10</text>
    <line x1="148" y1="648" x2="372" y2="648" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="156" y="642" fill="#cfe9d8">POST /chat/query { tenant, connection, "Transfer 40 units …" }</text>

    <text x="56" y="682" fill="#f3e9d2" font-size="12" font-weight="700">11</text>
    <rect x="386" y="666" width="236" height="26" rx="6" fill="#15505f" stroke="#2f7f93"/>
    <text x="504" y="684" fill="#aecfd6" font-size="11.5" text-anchor="middle">load the tenant's manifest</text>

    <text x="56" y="722" fill="#f3e9d2" font-size="12" font-weight="700">12</text>
    <line x1="378" y1="728" x2="602" y2="728" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="386" y="722" fill="#cfe9d8">process_query — manifest and credentials go into RunnableConfig</text>

    <text x="56" y="762" fill="#f3e9d2" font-size="12" font-weight="700">13</text>
    <line x1="608" y1="768" x2="1072" y2="768" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="616" y="762" fill="#cfe9d8">messages + tool schemas (no credentials, no schema names)</text>

    <text x="56" y="802" fill="#f3e9d2" font-size="12" font-weight="700">14</text>
    <line x1="1072" y1="808" x2="614" y2="808" stroke="#7fb0bd" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#b)"/>
    <text x="616" y="802" fill="#aecfd6">tool call: transfer_inventory_stock(sku, 40, WH-LONDON, WH-LEEDS)</text>

    <text x="56" y="842" fill="#f3e9d2" font-size="12" font-weight="700">15</text>
    <line x1="608" y1="848" x2="832" y2="848" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="616" y="842" fill="#cfe9d8">resolve logical → physical names via the manifest</text>

    <text x="56" y="882" fill="#f3e9d2" font-size="12" font-weight="700">16</text>
    <line x1="838" y1="888" x2="1072" y2="888" stroke="#88d498" stroke-width="2" marker-end="url(#a)"/>
    <text x="846" y="882" fill="#cfe9d8">both legs in ONE transaction</text>

    <rect x="846" y="900" width="330" height="62" rx="8" fill="#0f3d4a" stroke="#2f7f93" stroke-dasharray="4 3"/>
    <text x="860" y="920" fill="#aecfd6" font-size="11">UPDATE … SET qty = qty - 40 WHERE qty &gt;= 40 (source)</text>
    <text x="860" y="937" fill="#aecfd6" font-size="11">UPDATE … SET qty = qty + 40 (destination)</text>
    <text x="860" y="954" fill="#88d498" font-size="11">either both apply, or neither does</text>

    <text x="56" y="992" fill="#f3e9d2" font-size="12" font-weight="700">17</text>
    <line x1="1072" y1="998" x2="844" y2="998" stroke="#7fb0bd" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#b)"/>
    <text x="846" y="992" fill="#aecfd6">row counts</text>

    <text x="56" y="1032" fill="#f3e9d2" font-size="12" font-weight="700">18</text>
    <line x1="832" y1="1038" x2="614" y2="1038" stroke="#7fb0bd" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#b)"/>
    <text x="616" y="1032" fill="#aecfd6">JSON result, or { "status": "error", … } the agent can explain</text>

    <text x="56" y="1072" fill="#f3e9d2" font-size="12" font-weight="700">19</text>
    <path d="M 614 1086 L 1072 1086" stroke="#88d498" stroke-width="2" marker-end="url(#a)" fill="none"/>
    <text x="616" y="1080" fill="#cfe9d8">tool result fed back — loop to step 13 until the agent is done</text>

    <text x="56" y="1122" fill="#f3e9d2" font-size="12" font-weight="700">20</text>
    <line x1="602" y1="1128" x2="154" y2="1128" stroke="#7fb0bd" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#b)"/>
    <text x="164" y="1122" fill="#aecfd6">final answer rendered in the chat bubble</text>
  </g>
</svg>
